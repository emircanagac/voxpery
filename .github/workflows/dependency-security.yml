name: Security / Dependency Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security-deps:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            apps/server -> target
            apps/desktop/src-tauri -> target

      - name: Install cargo-audit (prebuilt)
        uses: taiki-e/install-action@977cdbe2e748fc9d5798e3098868c4c4463bf31b # cargo-audit

      - name: Dependency audit (Rust)
        working-directory: apps/server
        run: |
          for attempt in 1 2 3; do
            cargo audit --deny warnings && exit 0
            sleep $((attempt * 10))
          done
          exit 1

      - name: Dependency audit (desktop Rust)
        working-directory: apps/desktop/src-tauri
        run: |
          for attempt in 1 2 3; do
            cargo audit --deny warnings && exit 0
            sleep $((attempt * 10))
          done
          exit 1

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Dependency audit (web prod deps, lockfile)
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
