name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security:
    name: Checks / Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable migration history
        env:
          MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node .github/scripts/validate-migration-history.mjs

      - name: Check WebSocket event contract
        run: node .github/scripts/check-ws-event-sync.mjs

      - name: Secret scan (gitleaks)
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.24.3 \
            git --redact --verbose --exit-code 1

  release_metadata:
    name: Release / Metadata
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Check release version sync
        run: node .github/scripts/check-release-version-sync.mjs

  changes:
    name: Checks / Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
      desktop: ${{ steps.detect.outputs.desktop }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Documentation-only changes skip the build checks. Tags, manual runs and
      # unknown bases run everything; see .github/scripts/ci-changes.mjs.
      - name: Detect affected checks
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: node .github/scripts/ci-changes.mjs

  backend:
    name: Checks / Backend
    needs: changes
    if: >-
      !cancelled()
      && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Google's Docker Hub mirror: Docker Hub and ECR Public both throttle anonymous pulls
        # from shared GitHub runner addresses.
        image: mirror.gcr.io/library/postgres:16.15-alpine3.24
        env:
          POSTGRES_USER: voxpery_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: voxpery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voxpery_test -d voxpery_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: mirror.gcr.io/library/redis:7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy

      # Some sources keep mixed CRLF/LF line endings; check a copy with LF endings so only
      # formatting is compared.
      - name: Format
        shell: bash
        run: |
          check_dir="$(mktemp -d)"
          cp -r apps/server "$check_dir/server"
          find "$check_dir/server" -name '*.rs' -exec sed -i 's/\r$//' {} +
          cd "$check_dir/server" && cargo fmt --check

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/server -> target

      - name: Check
        working-directory: apps/server
        run: cargo check --locked

      - name: Clippy
        working-directory: apps/server
        run: cargo clippy --locked -- -D warnings

      - name: Test
        working-directory: apps/server
        env:
          TEST_DATABASE_URL: postgres://voxpery_test:postgres@127.0.0.1:5432/voxpery_test
          TEST_REDIS_URL: redis://127.0.0.1:6379
        run: cargo test --locked -- --test-threads=1

  frontend:
    name: Checks / Frontend
    needs: changes
    if: >-
      !cancelled()
      && (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Validate security policies
        run: node .github/scripts/validate-security-policies.mjs

      - name: Validate deploy automation
        run: node .github/scripts/validate-deploy-workflows.mjs

      - name: Install
        working-directory: apps/web
        run: npm ci

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Test
        working-directory: apps/web
        run: npm run test:run

      - name: Repository regression scripts
        run: node --test scripts/tests/*.test.mjs .github/scripts/*.test.mjs

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Basic feature UI smoke
        working-directory: apps/web
        run: npm run test:e2e:ui-smoke

      - name: Mobile web smoke
        working-directory: apps/web
        run: npm run test:e2e:mobile-smoke

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-core-ui-smoke-playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Build
        working-directory: apps/web
        run: npm run build

      - name: Check initial bundle budget
        working-directory: apps/web
        run: npm run check:initial-bundle

  frontend_firefox:
    # Runs beside Checks / Frontend so Firefox-only layout and media bugs block merges without
    # making the Chromium job longer.
    name: Checks / Frontend (Firefox)
    needs: changes
    if: >-
      !cancelled()
      && (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright Firefox
        working-directory: apps/web
        run: npx playwright install --with-deps firefox

      - name: Basic feature UI smoke (Firefox)
        working-directory: apps/web
        run: npm run test:e2e:ui-smoke:firefox

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-firefox-ui-smoke-playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  desktop:
    name: Checks / Desktop
    needs: changes
    if: >-
      !cancelled()
      && (needs.changes.result != 'success' || needs.changes.outputs.desktop == 'true')
    # Linux desktop runs on Chromium (CEF), which needs GTK 4.14+ (Ubuntu 24.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # The Ubuntu mirror is sometimes very slow (45 MB took 19 minutes), so the downloaded
      # packages are cached; the key changes with the package list below.
      - name: Cache Linux packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-cache
          key: apt-desktop-ubuntu-24.04-${{ hashFiles('.github/desktop-apt-packages.txt') }}

      - name: Install Linux dependencies
        timeout-minutes: 15
        run: |
          mkdir -p ~/apt-cache/archives/partial
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Dir::Cache::Archives="$HOME/apt-cache/archives")
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y $(cat .github/desktop-apt-packages.txt)
          # apt leaves its download folder to root; the cache step must be able to read it.
          sudo chown -R "$(id -u):$(id -g)" ~/apt-cache

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Test Linux launchers
        run: node --test .github/scripts/validate-linux-launchers.test.mjs scripts/dev/local-qa-config.test.mjs

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy

      # Same line-ending normalization as the backend format check.
      - name: Format
        shell: bash
        run: |
          check_dir="$(mktemp -d)"
          cp -r apps/desktop/src-tauri "$check_dir/src-tauri"
          find "$check_dir/src-tauri" -name '*.rs' -exec sed -i 's/\r$//' {} +
          cd "$check_dir/src-tauri" && cargo fmt --check

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri -> target

      # Tauri embeds frontendDist at compile time; a placeholder keeps this job independent of the web build.
      - name: Prepare placeholder frontend
        run: |
          mkdir -p apps/web/dist
          echo '<!doctype html><title>Voxpery</title>' > apps/web/dist/index.html

      - name: Check
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked

      - name: Clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --locked -- -D warnings

      - name: Test
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked

  docker_publish:
    # GitHub appends the matrix value, e.g. "Publish / Docker (backend)"; a static name stays readable when skipped.
    name: Publish / Docker
    needs:
      - security
      - release_metadata
      - backend
      - frontend
      - frontend_firefox
      - desktop
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        component:
          - backend
          - frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::12}"
          sha_tag="sha-${short_sha}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            {
              echo "display_tag=${GITHUB_REF_NAME}"
              echo "backend_tags<<EOF"
              echo "voxpery/voxpery-server:${GITHUB_REF_NAME}"
              echo "voxpery/voxpery-server:${sha_tag}"
              echo "EOF"
              echo "frontend_tags<<EOF"
              echo "voxpery/voxpery-web:${GITHUB_REF_NAME}"
              echo "voxpery/voxpery-web:${sha_tag}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "display_tag=${sha_tag}"
              echo "backend_tags<<EOF"
              echo "voxpery/voxpery-server:${sha_tag}"
              echo "EOF"
              echo "frontend_tags<<EOF"
              echo "voxpery/voxpery-web:${sha_tag}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push backend
        if: matrix.component == 'backend'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./apps/server
          file: ./apps/server/Dockerfile
          push: true
          pull: true
          build-args: |
            SECURITY_UPDATES_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          tags: ${{ steps.tags.outputs.backend_tags }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Build and push frontend
        if: matrix.component == 'frontend'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: true
          pull: true
          tags: ${{ steps.tags.outputs.frontend_tags }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            TURNSTILE_SITE_KEY_PUBLIC=${{ secrets.VITE_TURNSTILE_SITE_KEY }}
            VITE_APP_VERSION=${{ steps.tags.outputs.display_tag }}
            VITE_GIPHY_API_KEY=${{ vars.VITE_GIPHY_API_KEY }}
            APP_ENV=production
            SECURITY_UPDATES_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  release_deploy_gate:
    name: Release / Production Deploy Gate
    needs: docker_publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify published stable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_json=""

          for attempt in 1 2 3 4 5 6; do
            if release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>/dev/null)"; then
              break
            fi
            if [ "${attempt}" -lt 6 ]; then
              echo "Published release ${RELEASE_TAG} is not visible yet; retrying in 10 seconds."
              sleep 10
            fi
          done

          if [ -z "${release_json}" ]; then
            echo "Refusing automatic deploy: ${RELEASE_TAG} is not a published GitHub Release."
            exit 1
          fi

          if [ "$(printf '%s' "${release_json}" | jq -r '.draft')" != "false" ]; then
            echo "Refusing automatic deploy: draft releases are not production deployable."
            exit 1
          fi

          if [ "$(printf '%s' "${release_json}" | jq -r '.prerelease')" != "false" ]; then
            echo "Refusing automatic deploy: prereleases are not production deployable."
            exit 1
          fi

          if [ "$(printf '%s' "${release_json}" | jq -r '.tag_name')" != "${RELEASE_TAG}" ]; then
            echo "Refusing automatic deploy: release tag does not match the triggering tag."
            exit 1
          fi

  deploy_release:
    name: Release / Production Deploy
    needs: release_deploy_gate
    if: needs.release_deploy_gate.result == 'success'
    uses: ./.github/workflows/deploy.yml
    with:
      release_channel: custom
      image_tag: ${{ github.ref_name }}
      git_ref: ${{ github.ref_name }}
    secrets: inherit
