name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security:
    name: Checks / Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Secret scan (gitleaks)
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.24.3 \
            git --redact --verbose --exit-code 1

  release_metadata:
    name: Release / Metadata
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check release version sync
        run: node .github/scripts/check-release-version-sync.mjs

  backend:
    name: Checks / Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: voxpery_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: voxpery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voxpery_test -d voxpery_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/server -> target

      - name: Check
        working-directory: apps/server
        run: cargo check --locked

      - name: Test
        working-directory: apps/server
        env:
          TEST_DATABASE_URL: postgres://voxpery_test:postgres@127.0.0.1:5432/voxpery_test
          TEST_REDIS_URL: redis://127.0.0.1:6379
        run: cargo test --locked -- --test-threads=1

  frontend:
    name: Checks / Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Validate security policies
        run: node .github/scripts/validate-security-policies.mjs

      - name: Validate deploy automation
        run: node .github/scripts/validate-deploy-workflows.mjs

      - name: Install
        working-directory: apps/web
        run: npm ci

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Test
        working-directory: apps/web
        run: npm run test:run

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Core UI smoke
        working-directory: apps/web
        run: npm run test:e2e:ui-smoke

      - name: Mobile web smoke
        working-directory: apps/web
        run: npm run test:e2e:mobile-smoke

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-core-ui-smoke-playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Build
        working-directory: apps/web
        run: npm run build

      - name: Check initial bundle budget
        working-directory: apps/web
        run: npm run check:initial-bundle

  docker_publish:
    name: ${{ matrix.component == 'backend' && 'Publish / Docker Backend' || 'Publish / Docker Frontend' }}
    needs:
      - security
      - release_metadata
      - backend
      - frontend
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        component:
          - backend
          - frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::12}"
          sha_tag="sha-${short_sha}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            {
              echo "display_tag=${GITHUB_REF_NAME}"
              echo "backend_tags<<EOF"
              echo "voxpery/voxpery-server:${GITHUB_REF_NAME}"
              echo "voxpery/voxpery-server:${sha_tag}"
              echo "EOF"
              echo "frontend_tags<<EOF"
              echo "voxpery/voxpery-web:${GITHUB_REF_NAME}"
              echo "voxpery/voxpery-web:${sha_tag}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "display_tag=${sha_tag}"
              echo "backend_tags<<EOF"
              echo "voxpery/voxpery-server:${sha_tag}"
              echo "EOF"
              echo "frontend_tags<<EOF"
              echo "voxpery/voxpery-web:${sha_tag}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push backend
        if: matrix.component == 'backend'
        uses: docker/build-push-action@v7
        with:
          context: ./apps/server
          file: ./apps/server/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.backend_tags }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Build and push frontend
        if: matrix.component == 'frontend'
        uses: docker/build-push-action@v7
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.frontend_tags }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            TURNSTILE_SITE_KEY_PUBLIC=${{ secrets.VITE_TURNSTILE_SITE_KEY }}
            VITE_APP_VERSION=${{ steps.tags.outputs.display_tag }}
            VITE_GIPHY_API_KEY=${{ vars.VITE_GIPHY_API_KEY }}
            APP_ENV=production
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  release_deploy_gate:
    name: Release / Production Deploy Gate
    needs: docker_publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify published stable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_json=""

          for attempt in 1 2 3 4 5 6; do
            if release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>/dev/null)"; then
              break
            fi
            if [ "${attempt}" -lt 6 ]; then
              echo "Published release ${RELEASE_TAG} is not visible yet; retrying in 10 seconds."
              sleep 10
            fi
          done

          if [ -z "${release_json}" ]; then
            echo "Refusing automatic deploy: ${RELEASE_TAG} is not a published GitHub Release."
            exit 1
          fi

          if [ "$(printf '%s' "${release_json}" | jq -r '.draft')" != "false" ]; then
            echo "Refusing automatic deploy: draft releases are not production deployable."
            exit 1
          fi

          if [ "$(printf '%s' "${release_json}" | jq -r '.prerelease')" != "false" ]; then
            echo "Refusing automatic deploy: prereleases are not production deployable."
            exit 1
          fi

          if [ "$(printf '%s' "${release_json}" | jq -r '.tag_name')" != "${RELEASE_TAG}" ]; then
            echo "Refusing automatic deploy: release tag does not match the triggering tag."
            exit 1
          fi

  deploy_release:
    name: Release / Production Deploy
    needs: release_deploy_gate
    if: needs.release_deploy_gate.result == 'success'
    uses: ./.github/workflows/deploy.yml
    with:
      release_channel: custom
      image_tag: ${{ github.ref_name }}
      git_ref: ${{ github.ref_name }}
    secrets: inherit
