# Build desktop app (Tauri 2) and attach artifacts to a GitHub Release.
# Linux ships a .deb, an .rpm and a .flatpak bundle (built from the .deb, see
# apps/desktop/src-tauri/linux/flatpak).
# Trigger: push a tag v* (all platforms) or run manually (workflow_dispatch).
# Manual run: choose "Single platform" to build only one OS (~8-10 min instead of ~20).
# Set repo secret VITE_API_URL and repository variables VITE_TURNSTILE_SITE_KEY
# and optional VITE_GIPHY_API_KEY for production integrations.

name: Release / Desktop

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build (single = faster for testing)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - macos
          - linux
      smoke_checklist_confirmed:
        description: 'I completed docs/RELEASE_SMOKE_TEST_CHECKLIST.md for this candidate release'
        required: true
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Sync desktop version metadata
        run: node .github/scripts/sync-desktop-version.mjs

      - name: Inject updater public key
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: node .github/scripts/inject-desktop-updater-key.mjs

      - name: Validate desktop metadata and icon bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node .github/scripts/validate-desktop-release.mjs

      - name: Test Linux launchers and local QA URL normalization
        run: node --test .github/scripts/validate-linux-launchers.test.mjs scripts/dev/local-qa-config.test.mjs

      - name: Verify smoke checklist confirmation (manual runs)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.smoke_checklist_confirmed != 'yes'
        run: |
          echo "::error::Please complete docs/RELEASE_SMOKE_TEST_CHECKLIST.md and rerun with smoke_checklist_confirmed=yes."
          exit 1

  build-desktop:
    needs: preflight
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # Manual run with single platform = faster (~8-10 min). Tag push = all platforms.
        include: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.platform == 'windows' && fromJSON('[{"platform":"windows-latest","args":""}]') || github.event_name == 'workflow_dispatch' && github.event.inputs.platform == 'macos' && fromJSON('[{"platform":"macos-latest","args":"--target universal-apple-darwin"}]') || github.event_name == 'workflow_dispatch' && github.event.inputs.platform == 'linux' && fromJSON('[{"platform":"ubuntu-24.04","args":""}]') || fromJSON('[{"platform":"windows-latest","args":""},{"platform":"macos-latest","args":"--target universal-apple-darwin"},{"platform":"ubuntu-24.04","args":""}]') }}
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgtk-4-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libxdo-dev libssl-dev patchelf cmake ninja-build file

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Sync desktop version metadata
        run: node .github/scripts/sync-desktop-version.mjs

      - name: Inject updater public key
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: node .github/scripts/inject-desktop-updater-key.mjs

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Require desktop release frontend env
        shell: bash
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY || secrets.VITE_TURNSTILE_SITE_KEY }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::VITE_API_URL repository secret must be set (Settings -> Secrets -> Actions)."
            exit 1
          fi
          if [ -z "$VITE_TURNSTILE_SITE_KEY" ]; then
            echo "::error::VITE_TURNSTILE_SITE_KEY repository variable or secret must be set for desktop register CAPTCHA."
            exit 1
          fi

      - name: Build web UI
        working-directory: apps/web
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY || secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_GIPHY_API_KEY: ${{ vars.VITE_GIPHY_API_KEY }}
        run: npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri -> target

      # Linux bundles the Chromium (CEF) distribution; cache the ~1 GB download between releases.
      - name: Cache CEF distribution
        if: matrix.platform == 'ubuntu-24.04'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tauri-cef
          key: tauri-cef-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}

      # Icons must be committed in apps/desktop/src-tauri/icons/ (see docs/DESKTOP_RELEASE_HARDENING.md).

      - name: Build Tauri and create release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_LINUX_AYATANA_APPINDICATOR: '1'
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: 'Voxpery v__VERSION__'
          releaseBody: 'Desktop release. Download the installer for your platform below.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          # The desktop crate is on Tauri 3; build with the matching CLI.
          tauriScript: npx --yes @tauri-apps/cli@3.0.0-alpha.4

      - name: Validate desktop artifacts
        run: node .github/scripts/validate-desktop-artifacts.mjs

      - name: Keep the Linux .deb for the Flatpak bundle
        if: matrix.platform == 'ubuntu-24.04'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-deb
          path: apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 3

  flatpak:
    name: Linux Flatpak bundle
    needs: build-desktop
    if: github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'linux'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      # flatpak-builder needs to create its own sandboxes inside the container.
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download the Linux .deb
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-deb
          path: deb

      - name: Read the release version
        id: version
        shell: bash
        run: |
          deb="$(ls deb/*.deb)"
          version="$(basename "$deb" | sed -n 's/^Voxpery_\(.*\)_amd64\.deb$/\1/p')"
          if [ -z "$version" ]; then
            echo "::error::Unexpected .deb name: $deb"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the built version $version"
            exit 1
          fi
          echo "deb=$deb" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the Flatpak bundle
        shell: bash
        env:
          DEB: ${{ steps.version.outputs.deb }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sh apps/desktop/src-tauri/linux/flatpak/prepare-build-dir.sh "$DEB" "$VERSION" "$(date -u +%F)" flatpak-src
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --repo=repo --force-clean --disable-rofiles-fuse \
            build flatpak-src/com.voxpery.Voxpery.yml
          flatpak build-bundle repo "Voxpery_${VERSION}_x86_64.flatpak" com.voxpery.Voxpery \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
          # The bundle must carry the release version in its metadata as well as its name.
          grep -q "version=\"$VERSION\"" build/files/share/metainfo/com.voxpery.Voxpery.metainfo.xml

      - name: Keep the Flatpak bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-flatpak
          path: Voxpery_${{ steps.version.outputs.version }}_x86_64.flatpak
          if-no-files-found: error
          retention-days: 3

  publish-flatpak:
    name: Attach the Flatpak bundle to the release
    needs: flatpak
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the Flatpak bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-flatpak

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          file="$(ls Voxpery_*_x86_64.flatpak)"
          version="$(echo "$file" | sed -n 's/^Voxpery_\(.*\)_x86_64\.flatpak$/\1/p')"
          # tauri-action created this (draft) release while building the .deb and .rpm.
          gh release upload "v$version" "$file" --clobber --repo "$GITHUB_REPOSITORY"
