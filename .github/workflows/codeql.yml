name: Security / CodeQL

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/server/**'
      - 'apps/desktop/src-tauri/**'
      - 'apps/web/**'
      - '.github/workflows/**'
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze-rust:
    name: Analyze (rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL (rust)
        uses: github/codeql-action/init@v4
        with:
          languages: rust

      - name: Autobuild (rust)
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis (rust)
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:rust'

  analyze-js:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL (javascript-typescript)
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis (javascript-typescript)
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'

  analyze-actions:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL (actions)
        uses: github/codeql-action/init@v4
        with:
          languages: actions

      - name: Perform CodeQL Analysis (actions)
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:actions'
