[package]
name = "voxpery-desktop"
version = "0.5.4"
edition = "2021"
description = "Voxpery Desktop - Tauri-based desktop app"
license = "AGPL-3.0-only"

[dependencies]
tauri = { version = "=3.0.0-alpha.5", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-deep-link = "=3.0.0-alpha.3"
image = { version = "0.25", default-features = false, features = ["png"] }
tauri-plugin-window-state = "=3.0.0-alpha.2"
# Same keyring entries as tauri-plugin-secure-storage 1.x (service = product name).
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "=3.0.0-alpha.3"
tauri-plugin-http = "=3.0.0-alpha.3"
# Same reqwest/rustls as tauri-plugin-http, which no longer re-exports reqwest (custom server probe).
reqwest = { version = "0.13", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tauri-plugin-single-instance = "=3.0.0-alpha.3"
tauri-plugin-process = "=3.0.0-alpha.3"
tauri-plugin-opener = "=3.0.0-alpha.3"
tauri-plugin-updater = { version = "=3.0.0-alpha.3", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-global-shortcut = "=3.0.0-alpha.3"

# Windows and macOS keep the system webview (WebView2 / WKWebView).
[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri-runtime-wry = "=3.0.0-alpha.5"

# Linux uses Chromium (CEF): system WebKitGTK builds ship without WebRTC.
[target.'cfg(target_os = "linux")'.dependencies]
# CEF 154 (tauri-runtime-cef alpha.6 and later) no longer ships libEGL.so and libGLESv2.so, which
# the Tauri bundler still copies into the .deb and .rpm, so Linux packaging fails. Stay on CEF 152
# (alpha.5; tauri-runtime alpha.4 has the same API as alpha.3) until the bundler is fixed.
tauri-runtime-cef = "=3.0.0-alpha.5"
# Same versions as tauri-runtime-cef; used to restore keyboard focus (src/linux_focus.rs).
cef = { version = "=152.3.0", default-features = false }
x11-dl = "=2.21.0"

[dev-dependencies]
# Mock runtime for the IPC access tests.
tauri = { version = "=3.0.0-alpha.5", features = ["tray-icon", "test"] }

[build-dependencies]
tauri-build = { version = "=3.0.0-alpha.4", features = [] }

[patch.crates-io]
# Temporary desktop build-time patch for GHSA-cq8v-f236-94qc / RUSTSEC-2026-0097.
# Tauri's transitive HTML parsing chain still pulls phf_generator 0.8.0,
# whose upstream crate depends on rand 0.7.x. Keep this patch until upstream
# removes the vulnerable rand line from the dependency graph.
phf_generator = { path = "vendor/phf_generator-0.8.0" }
